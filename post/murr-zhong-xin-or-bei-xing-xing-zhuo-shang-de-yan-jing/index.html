<p>Patia当上天文台台长之前的故事 ​​​</p>
</div>
<!-- more -->
<hr style="
  border: 0;
  border-top: 1px solid #ddd3df;
  margin: 26px 0;
<p>清晨的雾气尚未散去，一位披着披风的女士带上遮雨帽，提着皮包走上了通往山顶的石阶。<br>
　　石阶上充斥着茂密的丛林与枝蔓，水汽顺着山坡漫上，脚边跑动着松鼠，头顶掠过飞鸟，湿气很高，帕蒂亚知道今天并不是个观测天体的好日子，但是她还是要去天文台，用精密仪器测量底片上恒星的位置、在纸张上作出各类计算，做她们这些女士该做的工作。<br>
　　帕蒂亚推开门，绕过八角回廊，前往工作室，从抽屉理出昨天尚未完成的计算图纸继续演算。<br>
　　天文研究并非外人看来用望远镜探视天上无垠星空那般浪漫，大量的数据，不计其数的修正、计算，确定星体的位置，为了“天图计划”，这一世界各地天文台共同进行星图绘制的伟大计划，不远处修道院的修女也前来担任了“计算员”来完成这数目庞大的计算工作。今天是礼拜日，帕蒂亚少了许多同伴，她完成了上午的工作后看着身边空着的位置，不由得觉得有些寂寞。</p>
<p>“午安，帕蒂亚。&quot;</p>
<p>只有汽灯亮着的昏暗房间内，银白色的弧线从满是树荫的窗外飞进来，帕蒂亚的面前出现了一颗星糖，帕蒂亚接过这份礼物，看着窗外坐在扫帚上的男人，西装革履的他穿着星星斗篷流转着星星点点的亮光，整个人像白日里的焰火般荒唐又美丽。</p>
<p>“午安，穆尔先生。”帕蒂亚心中雀跃着，看着面前的男人不由得笑了起来。<br>
　　“今天只有你一个人啊……毕竟今天是礼拜日，她们都要去侍奉神明呢。”穆尔遗憾地叹了口气，他抬起头，看着只有一人的帕蒂亚，摘下自己帽子向她行了礼，“我有一个小小的请求，可以把您的一天借用给我当我的助手吗？”<br>
　　“诶……？！”<br>
　　“不用担心，那些家伙都给自己放假去神乐街喝酒看歌剧去了，今天这里可是只有我们的游乐场，”穆尔·哈特露出仿佛恶作剧得逞的微笑，宛如祖母绿宝石的双眼微微眯起，带着些许引诱和试探，“想去二三楼逛逛吗，帕蒂亚？”</p>
<p>帕蒂亚想去吗？当她第一天进入这家天文台时，天文台台长带着她参观了整座天文台，一楼普通研究员工作的地方，二楼是档案室和几位高级研究员工作的办公室，三楼则是那镇台之宝存在的地方，一架耗费巨大财力精力制造出来给予人们窥视宇宙的望远镜，一旁高大的梯子的升降椅是暗红色的，台长说观测天体的时候则会打开高大的穹顶，研究员会坐在上面观测天体。<br>
　　普通的研究员除了传递工作内容外，是不被允许进入二楼和三楼的。每个在天文台工作到夜幕降临的时刻，帕蒂亚都会站在窗边仰望着深绀色的天空，看着大灾厄散发着柔和的光亮。<br>
　　沿着猎户座的腰带可以找到天狼星，再找到老人星，帕蒂亚用自己的眼睛看着在格子纸上留下的无数墨点与天上的星星对应起来，在心底暗暗想象着自己坐在暗红色升降椅仰望天空的模样，再远再细小的光点凭人类的眼睛就看不见了，她想亲眼看见那些星星，那些她笔下的墨点是否如她所见到的那般，在离她更加遥远的地方也同样看着她呢？</p>
<p>“……当然！我非常想去！”</p>
<p>帕蒂亚熬不犹豫地答应了穆尔·哈特。<br>
　　“太好了，看来我没有猜错您的愿望？”<br>
　　穆尔笑得更高兴了，他从窗户翻了进来，绅士地伸出手，待帕蒂亚的手放在他的手上时，便带着她第二次踏上了向上的楼梯。<br>
　　穆尔带着她走过了一间又一间的资料室，数不胜数的书籍放在与天花板一样高的书架，帕蒂亚激动着地看着这些藏书，忍不住伸手拂过它们的书脊。<br>
　　要是能一直看这些书就好了，要是能一直看这些资料就好了。<br>
　　越过那些高级研究员的办公室，帕蒂亚推开了剩下的一扇门，迎面一幅巨大的新月图像悬挂在墙壁上。<br>
　　“这是您的办公室吧？”帕蒂亚打趣道。<br>
　　“呀呀呀，毕竟我是这座天文台的名誉台长，为了面子也会留给我一个地方？”穆尔的语气带着些转瞬即逝的讽刺，转而笑吟吟地看着巨大的画像，“我把这个地方装饰成我喜欢的样子，来的时候会心情愉悦些，可惜橱柜里的咖啡豆在我上次来的时候用完了，不然可以请你喝咖啡。”<br>
　　穆尔的办公室是几间房间连通在一起的，堆放着他在这所天文台观测的月亮图像，一个咖啡壶，几枚宝石，成堆的手稿和书还有一架落灰的钢琴，应该许久没有弹过了。<br>
　　“您愿意让我参观已经很荣幸了。”帕蒂亚看着这件存放着各种仪器和手稿的房间，感受着心中从未有过的安定和希冀。<br>
　　“为您献上一首曲子吧，”穆尔看着夕阳将尽的天空，转身看着帕蒂亚，天空的余烬映照着他的脸颊和瞳孔，为他镀上了一层鎏金，“这首曲子完毕后我们就要去第三层了。”<br>
　　咒语落下，放在角落的钢琴和琴凳焕然一新，穆尔坐在房间里摆放的钢琴前，脱下了手套，修长美丽的手指在钢琴上轻跃着。鎏金落到地下消失不见，银缎飞上梢头迎风舞蹈。帕蒂亚的心因为乐声晃动着。她看着月光透过窗户照进这间屋子，照在穆尔俊美的侧脸上，仿佛一个轻柔的吻。</p>
<p>“这首曲子叫什么？”<br>
　　“追星逐月。”</p>
<p>帕蒂亚推开这间房间的最后一道门，看着明亮巨大的满月挂在出门可见的墙壁上，笑了起来。<br>
　　“很美的曲子，穆尔先生弹得很好。”<br>
　　“我觉得我们现在是一起干过坏事的交情，可以不用加先生这种称呼。”<br>
　　“……穆尔？”<br>
　　“是我哦。”</p>
<p>他们再次踏上了向上的楼梯，等走到观测室时，穆尔站在了一边。帕蒂亚呼吸急促，颤抖着握上了门把手，几次平复呼吸，终于下定决心般推开了她魂牵梦萦的那扇门。</p>
<p>帕蒂亚再次见到了那架巨大的望远镜。<br>
　　“我……我应该如何用它呢？我该怎么用它看星星呢？”<br>
　　帕蒂亚有些手足无措，她从未上过三楼，看着面前繁复的操纵台，她不知道该如何使用它。</p>
<p>“跟我来，帕蒂亚。”<br>
　　“这是操纵台，这个是控制赤纬度的按钮，这个是控制灯的按钮，这是替换的物镜……”<br>
　　帕蒂亚聚精会神地听着穆尔的声音，用眼睛将眼前的一切印刻在脑子里。<br>
　　“坐上去吧，帕蒂亚！去看星星！”<br>
　　帕蒂亚欣喜不已地坐上了暗红色的座椅，又突然想到什么似的，脸上的笑容消失了。<br>
　　“穆尔，今天雾气很大，不适合观星……”<br>
　　“你忘了我是魔法使了啊，帕蒂亚。”<br>
　　穆尔看着帕蒂亚忧郁的眼睛，向她露出了一个志在必得的笑容。</p>
<p>穿着星星披风的男人熟练地操纵着面前的操纵台，打开天文台的穹顶，帕蒂亚身后的轮盘转动绳索向上，她的座位升到适合使用望远镜的位置，他踩上了凭空出现的扫帚，飞向了广袤无垠的夜空。<br>
　　帕蒂亚紧张地坐在座位上，逐渐的，她感觉吹在手上的夜风是如此的怡人清爽，完全不像清晨那般湿意浓重的模样，她回忆着午后在资料室看的书，书里讲述如何操纵天文望远镜观测星星，她还沾着墨迹的的手小心翼翼地动作着，忐忑地透过这架巨大的望远镜望向天空。</p>
<p>“+41.54，+64+55，-13.6，-22.6……”<br>
　　“+37.30，+54+47，+9.30，-16.30……”<br>
　　“……”<br>
　　“……”<br>
　　“穆尔，我见到了……”<br>
　　“我看到纸上的星星了……”</p>
<p>帕蒂亚目不转睛地看着眼中的星体，无意间泪水早已争先恐后地从她的眼眶流出，她激动万分，心脏也似乎要跳出来看着她的身体颤动着、雀跃着。<br>
　　纸上的星星在距离她如此遥远的地方闪耀着，在这片智慧、壮丽和崇高的天空中，她能如此准确地找到光年外的明星，她的工作若能能让后人更多了解这片天空一份，便是再幸福不过的事了。</p>
<p>“帕蒂亚，你被星星灼伤了眼睛呢。”<br>
　　“用望远镜直视太阳才会被灼伤眼睛呢。”<br>
　　“有什么区别？我见过直视太阳的人，她和你一样哭了。”<br>
　　帕蒂亚看着坐在扫帚上看着她的男人破涕为笑：“我是高兴得哭了。”<br>
　　“那想要更一直这么高兴吗？”<br>
　　“嗯？”<br>
　　帕蒂亚心中有了猜测，但那个想法太过大胆，她有些不敢相信。<br>
　　“如果你愿意，我计划让你在两个月后在皇家科学院做一次公开学术报告，关于贝塔彗星回归早期的精密定位，我知道这是你一直在负责的部分，完毕后我会推举你为这家天文台的高级研究员。”穆尔专注地看着脸上依旧挂着泪痕的帕蒂亚。<br>
　　“我正在计划修建一座新的天文台，等修建好了你来当台长吧，帕蒂亚。”<br>
　　“……让一位出身低微的女性去担任你的新天文台台长会有很多困难的，穆尔。”帕蒂亚并没有拒绝，而是温和地注视着星空下的穆尔。<br>
　　穆尔笑着看着面前的帕蒂亚：“你和那些修女做着如此重要的工作，但是发表文章获得名誉都是那些脑袋腐朽大腹便便的家伙，你没有信心比他们更敏锐更智慧吗？”<br>
　　“当然有了，穆尔。”<br>
　　“帕蒂亚当然有。”<br>
　　“请出席我的学术报告演讲。”<br>
　　“当然。”<br>
　　<br>
　　穆尔看着帕蒂亚的眼睛，在星夜的见证下，与她做了一个小小的约定。</p>
