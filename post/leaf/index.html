<script>
  async function loadBlueskyFeed() {
    const handle = "lianwaii.bsky.social"; // 替换成你的 Handle
    const limit = 30; // 显示条数
    const url = `https://public.api.bsky.app/xrpc/app.bsky.feed.getAuthorFeed?actor=${handle}&limit=${limit}&filter=posts_no_replies`;

    try {
      const response = await fetch(url);
      const data = await response.json();
      const container = document.getElementById("bsky-feed");
      container.innerHTML = "";

      data.feed.forEach(item => {
        const post = item.post;
        // 跳过转发别人的帖子，只保留自己发的碎碎念
        if (item.reason) return;

        const text = post.record.text;
        const date = new Date(post.record.createdAt).toLocaleString("zh-CN", {
          year: "numeric", month: "2-digit", day: "2-digit",
          hour: "2-digit", minute: "2-digit"
        });

        const div = document.createElement("div");
        div.className = "bsky-item";
        div.innerHTML = `
          <div class="bsky-date">${date}</div>
          <div class="bsky-text">${text.replace(/\n/g, "<br>")}</div>
        `;
        container.appendChild(div);
      });
    } catch (error) {
      document.getElementById("bsky-feed").innerText = "动态加载失败";
      console.error(error);
    }
  }

  loadBlueskyFeed();
</script>

    <script>
      hljs.initHighlightingOnLoad()

      let mainNavLinks = document.querySelectorAll(".markdownIt-TOC a");

      // This should probably be throttled.
      // Especially because it triggers during smooth scrolling.
      // https://lodash.com/docs/4.17.10#throttle
      // You could do like...
      // window.addEventListener("scroll", () => {
      //    _.throttle(doThatStuff, 100);
      // });
      // Only not doing it here to keep this Pen dependency-free.

      window.addEventListener("scroll", event => {
        let fromTop = window.scrollY;

        mainNavLinks.forEach((link, index) => {
          let section = document.getElementById(decodeURI(link.hash).substring(1));
          let nextSection = null
          if (mainNavLinks[index + 1]) {
            nextSection = document.getElementById(decodeURI(mainNavLinks[index + 1].hash).substring(1));
          }
          if (section.offsetTop <= fromTop) {
            if (nextSection) {
              if (nextSection.offsetTop > fromTop) {
                link.classList.add("current");
              } else {
                link.classList.remove("current");    
              }
            } else {
              link.classList.add("current");
            }
          } else {
            link.classList.remove("current");
          }
        });
      });

    </script>
